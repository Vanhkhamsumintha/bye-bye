function shuffleArray(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function createQuestionRandomizer(){
 const questionOrder=shuffleArray(QUESTIONS.map((_,i)=>i));
 const choiceOrder={};
 questionOrder.forEach(qi=>{
  choiceOrder[qi]=shuffleArray(QUESTIONS[qi].choices.map((_,i)=>i));
 });
 return {questionOrder,choiceOrder};
}
function getQuestionData(r){
 const order=Array.isArray(r?.questionOrder)&&r.questionOrder.length
  ? r.questionOrder : QUESTIONS.map((_,i)=>i);
 const current=Number(r?.currentQuestion||0);
 const questionIndex=Number(order[current%order.length]);
 const q=QUESTIONS[questionIndex]||QUESTIONS[0];
 const saved=r?.choiceOrder?.[questionIndex];
 const choiceOrder=Array.isArray(saved)&&saved.length===q.choices.length
  ? saved : q.choices.map((_,i)=>i);
 return {q,choices:choiceOrder.map(i=>q.choices[i]),questionIndex,choiceOrder};
}

function setTimer(sec,done){
  clearInterval(timerHandle);
  const started=Date.now(), end=started+sec*1000;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    const elapsed=Math.min(sec*1000,Math.max(0,Date.now()-started));
    const progress=Math.max(0,100-(elapsed/(sec*1000))*100);
    document.querySelectorAll("[data-timer]").forEach(x=>x.textContent=left);
    document.querySelectorAll("[data-timer-ring]").forEach(x=>x.style.setProperty("--progress",progress+"%"));
    if(!left){clearInterval(timerHandle);if(done)done();}
  };
  tick();timerHandle=setInterval(tick,100);
}
function setPhaseTimer(sec,phaseStartedAt,done){
  clearInterval(timerHandle);
  const start=Number(phaseStartedAt)||Date.now(), end=start+sec*1000;
  let finished=false;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    const elapsed=Math.min(sec*1000,Math.max(0,Date.now()-start));
    const progress=Math.max(0,100-(elapsed/(sec*1000))*100);
    document.querySelectorAll("[data-timer]").forEach(x=>x.textContent=left);
    document.querySelectorAll("[data-timer-ring]").forEach(x=>x.style.setProperty("--progress",progress+"%"));
    if(!left&&!finished){finished=true;clearInterval(timerHandle);if(done)done();}
  };
  tick();timerHandle=setInterval(tick,100);
}

async function resolveVote(){
 const s=await db.ref(`rooms/${room}`).get(),r=s.val();
 if(!r||r.phase!=="vote")return;
 const ps=r.players||{},votes=r.votes||{},counts={};
 Object.entries(votes).forEach(([voter,target])=>{if(ps[voter]?.alive!==false && ps[target]?.alive!==false)counts[target]=(counts[target]||0)+1;});
 const alive=Object.entries(ps).filter(([,p])=>p.alive!==false).map(([id])=>id);
 if(!alive.length)return;
 const max=Math.max(...alive.map(pid=>counts[pid]||0));
 const top=alive.filter(pid=>(counts[pid]||0)===max);
 const selected=top[Math.floor(Math.random()*top.length)];
 await db.ref(`rooms/${room}`).update({selectedPlayer:selected,phase:"answerReveal",phaseStartedAt:firebase.database.ServerValue.TIMESTAMP,voteClosed:true});
}

async function leaveGameAfterLoss(){
  clearInterval(timerHandle);
  if(listenRef){listenRef.off();listenRef=null;}
  const oldRoom=room;
  const oldId=me?.id;
  // Remove ONLY this player from the shared game. Never delete the room,
  // because the remaining players must continue and reach the final duel.
  me=null;
  room=null;
  home();
  try{
    if(dbReady() && oldRoom && oldId){
      await db.ref(`rooms/${oldRoom}/players/${oldId}`).remove();
    }
  }catch(error){
    console.error("Remove eliminated player error:",error);
  }
}

              <h2>🏆 ທ່ານຊະນະ!</h2>
              <p>ຜູ້ແພ້: ${esc(loserName)}</p>
              <p>ຄະແນນ ${sa} - ${sb}</p>
              <p>⏳ ກຳລັງປະກາດຜູ້ຊະນະ...</p>
            </div>
          </div>
        `;
      }else{
        view.innerHTML=`
          <div class="center">
            ${duelScoreHTML(r)}

            <div class="result bad">
              <h2>💥 ທ່ານແພ້ແລ້ວ</h2>
              <p>ຜູ້ຊະນະ: ${esc(winnerName)}</p>
              <p>ຄະແນນ ${sa} - ${sb}</p>
              <p>⏳ ກຳລັງປະກາດຜູ້ຊະນະ...</p>
            </div>
          </div>
        `;
      }
    }

    return;
  }


  /* =========================
     DUEL RESULT
     ========================= */
  if(r.phase==="duelResult"){
    const ids=Object.keys(r.duelScores||{});

    if(ids.length<2){
      view.innerHTML=`
        <div class="center">
          <div class="result neutral">
            <h2>⏳ ລໍຖ້າຜົນ...</h2>

        </div>

    const winnerId=tie?null:(sa>sb?a:b);

          </div>
        </div>
      `;
    }else{
      const loserId=winnerId===a?b:a;

      const winnerName=
        r.players?.[winnerId]?.name ||

        "";

      const loserName=
        r.players?.[loserId]?.name ||
        "";

          <div class="center">
            ${duelScoreHTML(r)}

          </div>

          <div class="center">
            ${duelScoreHTML(r)}

            <div class="result bad">
              <h2>💥 ທ່ານແພ້ແລ້ວ</h2>

              <p>ຄະແນນ ${sa} - ${sb}</p>
            </div>
          </div>
        `;
      }
    }

    return;
  }


  /* =========================
     NORMAL VOTE
     ========================= */
  if(r.phase==="vote"){
    const myPlayer=r.players?.[me?.id];

    if(!myPlayer || myPlayer.alive===false){
      clearInterval(timerHandle);

      view.innerHTML=`
        <div class="center">
          <div class="result bad">

          </div>
        </div>
      `;

      setTimeout(()=>leaveGameAfterLoss(),1000);
      return;
    }

    const can=true;

    const chosen=r.votes?.[me.id];

    const chosenName=
      chosen
        ? r.players?.[chosen]?.name
        : "";

    view.innerHTML=`
      <div class="game">

        <div class="phase">
          🎯 ກຳຈັດຈຸດອ່ອນ • 10 ວິນາທີ
        </div>

        ${timerHTML(10)}

        ${
          chosen
            ? `
              <div class="vote-picked">
                <div class="vote-picked-icon">✓</div>
                <h2>ເລືອກຄົນນີ້ແລ້ວ</h2>
                <p><b>${esc(chosenName||"")}</b></p>
                <span>ລໍຖ້າຜູ້ຫຼິ້ນຄົນອື່ນ…</span>
              </div>
            `
            : `
              <p style="text-align:center">
                ເລືອກຄົນທີ່ທ່ານຕ້ອງການໃຫ້ຕອບ
              </p>

              <div class="votegrid">
                ${can?playersHTML(r.players,true,r):""}
              </div>
            `
        }

        <div class="note">
          ກົດເລືອກໄດ້ພຽງ 1 ຄັ້ງ •
          ບໍ່ກົດເລືອກ = ສະລະສິດ
          ແລະບໍ່ຖືກນັບເປັນຄະແນນໂຫວດ
        </div>

      </div>
    `;

    setPhaseTimer(10,r.phaseStartedAt,null);
    return;
  }


  /* =========================
     NORMAL ANSWER REVEAL
     ========================= */
  if(r.phase==="answerReveal"){
    const selected=r.selectedPlayer===me?.id;

    view.innerHTML=`
      <div class="center">
        <h1>${selected?"🎯":"⏳"}</h1>

        <h2>
          ${selected
            ?"ທ່ານຖືກເລືອກ"
            :"ກຳລັງລໍຖ້າ"}
        </h2>

        <p>
          ${selected
            ?"ກຽມຕົວຕອບຄຳຖາມ"

        </p>

        ${timerHTML(3)}
      </div>
    `;

    setPhaseTimer(3,r.phaseStartedAt,null);
    return;
  }


  /* =========================
     NORMAL ANSWER
     ========================= */
  if(r.phase==="answer" && r.selectedPlayer===me?.id){

          ${esc(r.players?.[r.selectedPlayer]?.name||"")}

        </h2>

        ${timerHTML(15)}
      </div>
    `;

    setPhaseTimer(15,r.phaseStartedAt,null);
    return;
  }


  /* =========================
     NORMAL RESULT
     ========================= */
  if(r.phase==="result"){
    resultPlayer(r);
    return;
  }


  /* =========================
     DEFAULT
     ========================= */
  view.innerHTML=`
    <div class="center">
      <h2>✨ ກຳລັງກຽມຮອບຕໍ່ໄປ...</h2>
    </div>
  `;
}

async function vote(target){
  if(!me||!room)return;

  const snap=await db.ref(`rooms/${room}`).get();
  const r=snap.val();

  if(!r || r.phase!=="vote" || r.votes?.[me.id])return;

  if(!r.players?.[me.id] || r.players[me.id].alive===false)return;

  if(!r.players?.[target] || r.players[target].alive===false)return;

  await db.ref(`rooms/${room}/votes/${me.id}`).set(target);
}
function answerPlayer(r){
 const {q,choices}=getQuestionData(r);
 view.innerHTML=`<div class="game"><div class="phase">🧠 ຕອບຄຳຖາມ • 15 ວິນາທີ</div>${timerHTML(15)}

 <div class="choices">${choices.map((c,i)=>`<button class="choice" onclick="submitAnswer(${i})">${mathText(esc(c))}</button>`).join("")}</div></div>`;
 renderMath();setTimer(15,()=>submitAnswer(-1));

async function submitAnswer(i){clearInterval(timerHandle);const r=(await db.ref("rooms/"+room).get()).val();if(r.phase!=="answer"||r.selectedPlayer!==me.id)return;const {q,choices}=getQuestionData(r),correct=i>=0&&choices[i]===q.answer;await finishAnswer(correct)}
async function finishAnswer(correct){
  const s=await db.ref("rooms/"+room).get(),r=s.val();
  if(!r||r.phase!=="answer")return;
  const pid=r.selectedPlayer, name=r.players?.[pid]?.name||"";
  if(correct){
    await db.ref(`rooms/${room}/players/${pid}/score`).transaction(x=>(Number(x)||0)+1);
    await db.ref(`rooms/${room}`).update({phase:"result",lastResult:"correct",lastResultName:name,eliminatedPlayer:null});
  }else{
    await db.ref(`rooms/${room}`).update({
      phase:"result",
      lastResult:"wrong",
      lastResultName:name,
      eliminatedPlayer:pid
    });
    // Mark eliminated immediately so the player can never be selected again.
    await db.ref(`rooms/${room}/players/${pid}/alive`).set(false);
    // Remove the eliminated player record after the result screen has had time
    // to display. Other players remain in the shared room.
    setTimeout(async()=>{
      try{
        const s=await db.ref(`rooms/${room}/phase`).get();
        if(s.val()==="result") await db.ref(`rooms/${room}/players/${pid}`).remove();
      }catch(e){ console.error("Remove wrong-answer player error:",e); }
    },3000);
  }
}

async function nextRound(){
 const r=(await db.ref("rooms/"+room).get()).val();
 const alive=Object.entries(r.players||{}).filter(([,p])=>p.alive!==false);
 if(alive.length<=1){
   await db.ref("rooms/"+room).update({phase:"winner",winnerId:alive[0]?.[0]||null});return;
 }
 if(alive.length===2){
   const a=alive[0][0],b=alive[1][0];
   await db.ref("rooms/"+room).update({
     phase:"duelReady",round:(r.round||1)+1,duelRound:1,duelIndex:0,
     duelScores:{[a]:0,[b]:0},duelAnswered:{},
     currentQuestion:((r.currentQuestion||0)+1)%QUESTIONS.length
   });return;
 }
 await db.ref("rooms/"+room).update({
   phase:"questionPreview",round:(r.round||1)+1,
   currentQuestion:((r.currentQuestion||0)+1)%QUESTIONS.length,votes:{}
 });
}
async function revealDuelScore(){
  if(!dbReady()||!room)return;
  const r=(await db.ref("rooms/"+room).get()).val();
  if(!r||r.phase!=="duelReview")return;
  await db.ref("rooms/"+room).update({phase:"duelResult",phaseStartedAt:firebase.database.ServerValue.TIMESTAMP});
}

async function finishDuelWinner(winnerId, loserId){
  if(!room || !winnerId || !loserId || winnerId===loserId)return;

  const s=await db.ref("rooms/"+room).get();
  const r=s.val();

  if(!r || (r.phase!=="duelReview" && r.phase!=="duelResult"))return;

  const winnerName=r.players?.[winnerId]?.name||"";
  const loserName=r.players?.[loserId]?.name||"";

  await db.ref("rooms/"+room).update({
    phase:"winner",
    winnerId,
    winnerName,
    eliminatedPlayer:loserId,
    eliminatedName:loserName,
    phaseStartedAt:firebase.database.ServerValue.TIMESTAMP
  });

  await db.ref(`rooms/${room}/players/${loserId}`).remove();
}

async function nextDuelGame(){
  if(!dbReady()||!room)return;
  const r=(await db.ref("rooms/"+room).get()).val();
  if(!r||r.phase!=="duelReview")return;
  const ids=Object.keys(r.duelScores||{}),a=ids[0],b=ids[1];
  if(!a||!b||Number(r.duelScores?.[a]||0)!==Number(r.duelScores?.[b]||0))return;

  const nextPid=r.selectedPlayer;

  await db.ref("rooms/"+room).update({
    duelRound:Number(r.duelRound||1)+1,
    duelScores:{...(r.duelScores||{})},
    duelAnswered:{},
    duelIndex:nextPid===a?0:1,
    currentQuestion:((r.currentQuestion||0)+1)%QUESTIONS.length,
    phase:"duelAnswerReveal",
    selectedPlayer:nextPid,
    phaseStartedAt:firebase.database.ServerValue.TIMESTAMP
  });
}

function leaveToHome(clean=true){
 clearInterval(timerHandle);
 if(listenRef){listenRef.off();listenRef=null;}
 const oldRoom=room, oldMe=me;
 if(clean && oldRoom && oldMe && !oldMe.host){
   db.ref(`rooms/${oldRoom}/players/${oldMe.id}`).remove().catch(()=>{});
 }
 me=null;room=null;
 home();
}

      ${tie
        ? `<div class="result neutral"><h2>🤝 ສະເໝີ</h2><p>ຄະແນນ ${sa} - ${sb}</p><div class="actions"><button class="btn primary" onclick="nextDuelGame()">ເກມຖັດໄປ</button></div></div>`
        : `<div class="result good"><h2>🏆 ຊະນະ: ${esc(winnerName)}</h2><p>ຄະແນນ ${sa} - ${sb}</p></div>`}
    </div>`;
    if(!tie){
      setTimeout(async()=>{
        try{
          const snap=await db.ref("rooms/"+room).get(),x=snap.val();
          if(x?.phase==="duelResult") await finishDuelWinner(winnerId,loserId);
        }catch(e){console.error("Finish duel error:",e);}
      },1200);
    }
    return;
  }
}
function duelAnswerPlayer(r){
  const {q,choices}=getQuestionData(r);
  view.innerHTML=`<div class="game"><div class="phase">⚔️ ຮອບ ${Number(r.duelRound||1)} • ຄຳຖາມຂອງທ່ານ</div>${timerHTML(15)}<div class="question">${mathText(esc(q.question))}</div><div class="choices">${choices.map((c,i)=>`<button class="choice" onclick="duelAnswerSubmit(${i})">${mathText(esc(c))}</button>`).join("")}</div></div>`;
  renderMath();
  setPhaseTimer(15,r.phaseStartedAt,()=>duelAnswerSubmit(-1));
}

async function duelAnswerSubmit(i){
  clearInterval(timerHandle);
  const r=(await db.ref("rooms/"+room).get()).val();
  if(!r||r.phase!=="duelAnswer"||r.selectedPlayer!==me?.id)return;
  const {q,choices}=getQuestionData(r);
  await finishDuelAnswer(i>=0&&choices[i]===q.answer);
}

async function finishDuelAnswer(correct){
  const s=await db.ref("rooms/"+room).get(),r=s.val();
  if(!r||r.phase!=="duelAnswer")return;

  const pid=r.selectedPlayer,
        scores={...(r.duelScores||{})},
        answered={...(r.duelAnswered||{})};

  if(answered[pid])return;

  if(correct)scores[pid]=(Number(scores[pid])||0)+1;
  answered[pid]=true;

  const alive=Object.entries(r.players||{}).filter(([,p])=>p.alive!==false);
  if(alive.length!==2)return;

  const a=alive[0][0],b=alive[1][0];

  if(!(answered[a]&&answered[b])){
    const nextPid=pid===a?b:a;

    await db.ref("rooms/"+room).update({
      duelScores:scores,
      duelAnswered:answered,
      duelIndex:nextPid===a?0:1,
      selectedPlayer:nextPid,
      phase:"duelAnswerReveal",
      phaseStartedAt:firebase.database.ServerValue.TIMESTAMP
    });
    return;
  }

  await db.ref("rooms/"+room).update({
    duelScores:scores,
    duelAnswered:answered,
    phase:"duelReview",
    phaseStartedAt:firebase.database.ServerValue.TIMESTAMP
  });
}

home();
</script>
