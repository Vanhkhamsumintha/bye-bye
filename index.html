function shuffleArray(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function createQuestionRandomizer(){
 const questionOrder=shuffleArray(QUESTIONS.map((_,i)=>i));
 const choiceOrder={};
 questionOrder.forEach(qi=>{
  choiceOrder[qi]=shuffleArray(QUESTIONS[qi].choices.map((_,i)=>i));
 });
 return {questionOrder,choiceOrder};
}
function getQuestionData(r){
 const order=Array.isArray(r?.questionOrder)&&r.questionOrder.length
  ? r.questionOrder : QUESTIONS.map((_,i)=>i);
 const current=Number(r?.currentQuestion||0);
 const questionIndex=Number(order[current%order.length]);
 const q=QUESTIONS[questionIndex]||QUESTIONS[0];
 const saved=r?.choiceOrder?.[questionIndex];
 const choiceOrder=Array.isArray(saved)&&saved.length===q.choices.length
  ? saved : q.choices.map((_,i)=>i);
 return {q,choices:choiceOrder.map(i=>q.choices[i]),questionIndex,choiceOrder};
}

  return `<div class="timer-wrap"><div class="timer" data-timer-ring data-duration="${sec}" style="--progress:100%"><b data-timer>${sec}</b><small>${label}</small></div></div>`;

function setTimer(sec,done){
  clearInterval(timerHandle);
  const started=Date.now(), end=started+sec*1000;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    const elapsed=Math.min(sec*1000,Math.max(0,Date.now()-started));
    const progress=Math.max(0,100-(elapsed/(sec*1000))*100);
    document.querySelectorAll("[data-timer]").forEach(x=>x.textContent=left);
    document.querySelectorAll("[data-timer-ring]").forEach(x=>x.style.setProperty("--progress",progress+"%"));
    if(!left){clearInterval(timerHandle);if(done)done();}
  };
  tick();timerHandle=setInterval(tick,100);
}
function setPhaseTimer(sec,phaseStartedAt,done){
  clearInterval(timerHandle);
  const start=Number(phaseStartedAt)||Date.now(), end=start+sec*1000;
  let finished=false;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    const elapsed=Math.min(sec*1000,Math.max(0,Date.now()-start));
    const progress=Math.max(0,100-(elapsed/(sec*1000))*100);
    document.querySelectorAll("[data-timer]").forEach(x=>x.textContent=left);
    document.querySelectorAll("[data-timer-ring]").forEach(x=>x.style.setProperty("--progress",progress+"%"));
    if(!left&&!finished){finished=true;clearInterval(timerHandle);if(done)done();}
  };
  tick();timerHandle=setInterval(tick,100);
}

async function resolveVote(){
  const s=await db.ref(`rooms/${room}`).get(),r=s.val();
  if(!r||r.phase!=="vote")return;
  const ps=r.players||{},votes=r.votes||{},counts={};
  Object.entries(votes).forEach(([voter,target])=>{
    if(ps[voter]?.alive!==false && ps[target]?.alive!==false && voter!==target) counts[target]=(counts[target]||0)+1;
  });
  const alive=Object.entries(ps).filter(([,p])=>p && p.alive!==false).map(([pid])=>pid);
  const selectedPlayers=alive.filter(pid=>(counts[pid]||0)>0);
  // Safety fallback: if nobody received a valid vote, everyone alive gets a chance to answer.
  const finalSelected=selectedPlayers.length?selectedPlayers:alive;
  const answers={};
  await db.ref(`rooms/${room}`).update({
    selectedPlayers:finalSelected,
    votes: votes,
    answers,
    phase:"multiAnswer",
    phaseStartedAt:firebase.database.ServerValue.TIMESTAMP,
    answerClosed:false,
    results:null
  });
}
function multiAnswerHost(r,alive){
  const selected=Array.isArray(r.selectedPlayers)?r.selectedPlayers:[];

  // ถ้าทุกคนตอบแล้ว ให้เปิดผลทันที
  const answers=r.answers||{};
  const done=selected.filter(pid=>answers[pid]?.submitted).length;

  if(selected.length && done===selected.length){

}

async function resolveMultiAnswers(){
  const ref=db.ref(`rooms/${room}`),s=await ref.get(),r=s.val();
  if(!r||r.phase!=="multiAnswer"||r.answerClosed)return;
  const selected=Array.isArray(r.selectedPlayers)?r.selectedPlayers:[];
  const answers=r.answers||{};
  if(!selected.length){await ref.update({phase:"result",answerClosed:true,results:{}});return;}
  const results={};
  selected.forEach(pid=>{const a=answers[pid];results[pid]={submitted:!!a?.submitted,correct:!!a?.submitted&&a.correct===true,choice:a?.choice??null};});
  const updates={answerClosed:true,results};
  const correctIds=[],wrongIds=[];
  selected.forEach(pid=>results[pid].correct?correctIds.push(pid):wrongIds.push(pid));
  const alive={...(r.players||{})};
  wrongIds.forEach(pid=>{if(alive[pid]) alive[pid]={...alive[pid],alive:false};});
  Object.entries(alive).forEach(([pid,p])=>{if(p && wrongIds.includes(pid)) updates[`players/${pid}/alive`]=false;});
  correctIds.forEach(pid=>{updates[`players/${pid}/score`]=(Number(alive[pid]?.score)||0)+1;});
  const survivors=Object.entries(alive).filter(([,p])=>p && p.alive!==false).map(([pid])=>pid);
  if(survivors.length<=1){
    const winnerId=survivors[0]||null;
    updates.phase="winner";updates.winnerId=winnerId;updates.winnerName=winnerId?(alive[winnerId]?.name||""):"";
  }else{
    updates.phase="result";
    updates.phaseStartedAt=firebase.database.ServerValue.TIMESTAMP;
  }
  await ref.update(updates);
}

async function vote(target){
  if(!me||!room||!dbReady())return;
  const snap=await db.ref(`rooms/${room}`).get(),r=snap.val();
  if(!r||r.phase!=="vote"||r.votes?.[me.id])return;
  if(target===me.id)return;
  if(!r.players?.[me.id]||r.players[me.id].alive===false)return;
  if(!r.players?.[target]||r.players[target].alive===false)return;
  await db.ref(`rooms/${room}/votes/${me.id}`).set(target);
}

async function submitMultiAnswer(i){
  clearInterval(timerHandle);
  if(!me||!room)return;
  const ref=db.ref(`rooms/${room}`),r=(await ref.get()).val();
  if(!r||r.phase!=="multiAnswer")return;
  const selected=Array.isArray(r.selectedPlayers)?r.selectedPlayers:[];
  if(!selected.includes(me.id)||r.answers?.[me.id]?.submitted)return;
  const {q,choices}=getQuestionData(r);
  const correct=i>=0&&choices[i]===q.answer;
  await ref.child(`answers/${me.id}`).set({submitted:true,choice:i,correct,answeredAt:firebase.database.ServerValue.TIMESTAMP});
}

async function nextRound(){
  if(!dbReady()||!room)return;
  const ref=db.ref(`rooms/${room}`),r=(await ref.get()).val();
  if(!r||r.phase!=="result")return;
  const alive=Object.entries(r.players||{}).filter(([,p])=>p&&p.alive!==false);
  if(alive.length<=1){
    const winnerId=alive[0]?.[0]||null;
    await ref.update({phase:"winner",winnerId,winnerName:winnerId?(alive[0][1].name||""):"",eliminatedPlayer:null,phaseStartedAt:firebase.database.ServerValue.TIMESTAMP});
    return;
  }
  await ref.update({
    phase:"questionPreview",
    round:Number(r.round||1)+1,
    currentQuestion:((Number(r.currentQuestion)||0)+1)%QUESTIONS.length,
    votes:{},selectedPlayers:[],answers:{},results:null,answerClosed:false,
    phaseStartedAt:firebase.database.ServerValue.TIMESTAMP
  });
}

 if(r.phase==="duelReview"){

    if(ids.length<2){
      view.innerHTML=`<div class="center"><div class="result neutral"><h2>⏳ ລໍຖ້າ A ແລະ B ຕອບໃຫ້ຄົບ</h2></div></div>`;
      return;
    }
    const a=ids[0],b=ids[1];
    const sa=Number(r.duelScores?.[a]||0),sb=Number(r.duelScores?.[b]||0);
    const tie=sa===sb;
    const winnerId=tie?null:(sa>sb?a:b);
    const winnerName=winnerId?(r.players?.[winnerId]?.name||""):"";
    const nameA=r.players?.[a]?.name||"A";
    const nameB=r.players?.[b]?.name||"B";

    view.innerHTML=`<div class="center">
      <span class="duel-round">📊 ຜົນການດວນຮອບນີ້</span>
      <div class="duel-score" style="margin:18px auto;max-width:620px">
        <div class="duel-player ${sa>sb?'winner':''}">
          <strong>${esc(nameA)}</strong><span>${sa}</span>
        </div>
        <div class="duel-vs">VS</div>
        <div class="duel-player ${sb>sa?'winner':''}">
          <strong>${esc(nameB)}</strong><span>${sb}</span>
        </div>
      </div>
      ${tie
        ? `<div class="result neutral">
             <h2>🤝 ສະເໝີ</h2>
             <p>ຄະແນນ ${sa} - ${sb}</p>
             <div class="actions">
               <button class="btn primary" onclick="nextDuelGame()">ເກມຖັດໄປ</button>
             </div>
           </div>`
        : `<div class="result good">
             <h2>🏆 ຊະນະ: ${esc(winnerName)}</h2>
             <p>ຄະແນນ ${sa} - ${sb}</p>
             <p>ສະຖານະ: ${esc(winnerName)} ຊະນະ</p>
           </div>`}
    </div>`;

    if(!tie){
      setTimeout(async()=>{
        try{
          const s=await db.ref("rooms/"+room).get(),x=s.val();
          if(x?.phase==="duelReview") await finishDuelWinner(winnerId, winnerId===a?b:a);
        }catch(e){ console.error("Finish duel error:",e); }
      },1500);
    }
    return;
  }
  if(r.phase==="duelResult"){
    const ids=Object.keys(r.duelScores||{});
    if(ids.length<2){
      view.innerHTML=`<div class="center"><div class="result neutral"><h2>⏳ ກຳລັງສະຫຼຸບຄະແນນ...</h2></div></div>`;
      return;
    }
    const a=ids[0],b=ids[1];
    const sa=Number(r.duelScores?.[a]||0),sb=Number(r.duelScores?.[b]||0);
    const tie=sa===sb,winnerId=tie?null:(sa>sb?a:b),loserId=tie?null:(sa>sb?b:a);
    const winnerName=winnerId?r.players?.[winnerId]?.name||"":"";
    view.innerHTML=`<div class="center"><span class="duel-round">📊 ຜົນການດວນ</span>${duelScoreHTML(r)}
      ${tie
        ? `<div class="result neutral"><h2>🤝 ສະເໝີ</h2><p>ຄະແນນ ${sa} - ${sb}</p><div class="actions"><button class="btn primary" onclick="nextDuelGame()">ເກມຖັດໄປ</button></div></div>`
        : `<div class="result good"><h2>🏆 ຊະນະ: ${esc(winnerName)}</h2><p>ຄະແນນ ${sa} - ${sb}</p></div>`}
    </div>`;
    if(!tie){
      setTimeout(async()=>{
        try{
          const snap=await db.ref("rooms/"+room).get(),x=snap.val();
          if(x?.phase==="duelResult") await finishDuelWinner(winnerId,loserId);
        }catch(e){console.error("Finish duel error:",e);}
      },1200);
    }
    return;
  }
}
function duelAnswerPlayer(r){
  const {q,choices}=getQuestionData(r);
  view.innerHTML=`<div class="game"><div class="phase">⚔️ ຮອບ ${Number(r.duelRound||1)} • ຄຳຖາມຂອງທ່ານ</div>${timerHTML(15)}<div class="question">${mathText(esc(q.question))}</div><div class="choices">${choices.map((c,i)=>`<button class="choice" onclick="duelAnswerSubmit(${i})">${mathText(esc(c))}</button>`).join("")}</div></div>`;
  renderMath();
  setPhaseTimer(15,r.phaseStartedAt,()=>duelAnswerSubmit(-1));
}

async function duelAnswerSubmit(i){
  clearInterval(timerHandle);
  const r=(await db.ref("rooms/"+room).get()).val();
  if(!r||r.phase!=="duelAnswer"||r.selectedPlayer!==me?.id)return;
  const {q,choices}=getQuestionData(r);
  await finishDuelAnswer(i>=0&&choices[i]===q.answer);
}

async function finishDuelAnswer(correct){
  const s=await db.ref("rooms/"+room).get(),r=s.val();
  if(!r||r.phase!=="duelAnswer")return;

  const pid=r.selectedPlayer,
        scores={...(r.duelScores||{})},
        answered={...(r.duelAnswered||{})};

  if(answered[pid])return;

  if(correct)scores[pid]=(Number(scores[pid])||0)+1;
  answered[pid]=true;

  const alive=Object.entries(r.players||{}).filter(([,p])=>p.alive!==false);
  if(alive.length!==2)return;

  const a=alive[0][0],b=alive[1][0];

  if(!(answered[a]&&answered[b])){
    const nextPid=pid===a?b:a;

    await db.ref("rooms/"+room).update({
      duelScores:scores,
      duelAnswered:answered,
      duelIndex:nextPid===a?0:1,
      selectedPlayer:nextPid,
      phase:"duelAnswerReveal",
      phaseStartedAt:firebase.database.ServerValue.TIMESTAMP
    });
    return;
  }

  await db.ref("rooms/"+room).update({
    duelScores:scores,
    duelAnswered:answered,
    phase:"duelReview",
    phaseStartedAt:firebase.database.ServerValue.TIMESTAMP
  });
}

home();
</script>
